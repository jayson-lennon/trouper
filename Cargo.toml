[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
actor-runtime = { path = "crates/actor-runtime" }
canvas = { path = "crates/canvas" }
state-report = { path = "crates/state-report" }
zenoh = "1.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v7", "serde"] }
arc-swap = "1.9"
wherror = "2.4"
error-stack = "0.8"
derive_more = { version = "2.1", features = ["debug"] }
tracing = "0.1"
bevy = { version = "0.19", default-features = false, features = [
    # Our usage: Camera2d, Mesh2d quads, Text2d labels, winit input, egui.
    # Hand-expanded 2d_bevy_render -> 2d_api -> common_api, minus what we
    # don't use: bevy_animation + bevy_gizmos (bundled by common_api),
    # bevy_post_process, bevy_gizmos_render, hdr/png codecs.
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite_render",
    # app plumbing: async_executor, bevy_asset, bevy_log, bevy_state,
    # reflect_auto_register.
    "default_app",
    # platform: std, winit, clipboard, default_font, multi_threaded,
    # x11 + wayland. Deliberately NOT: audio (symphonia/rodio), 3d, ui,
    # scene, gilrs (gamepads), picking, custom_cursor, sysinfo, webgl2.
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
] }
# render (draw egui via bevy), default_fonts (built-in egui font),
# manage_clipboard (copy out of popups). NOT bevy_ui/picking/open_url.
bevy_egui = { version = "0.41", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
] }
egui_json_tree = "0.16"
# dev
rstest = "0.26"
futures = "0.3"
tracing-subscriber = "0.3"

[package]
name = "actor-canvas"
version.workspace = true
edition.workspace = true

[dependencies]
actor-runtime.workspace = true
state-report.workspace = true
error-stack.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[profile.release]
lto = true
codegen-units = 1
