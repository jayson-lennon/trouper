[package]
name = "trouper"
version = "0.10.1"
edition = "2024"
description = "A single-machine actor runtime: schema registry, journaled event-sourced and service actors, topics, supervision, and partition sets"
license = "MIT"
repository = "https://github.com/jayson-lennon/trouper"
readme = "README.md"
keywords = ["actor", "actors", "event-sourcing", "runtime", "concurrency"]
categories = ["concurrency", "asynchronous"]
exclude = [
    "*.folded",
    "fire_and_forget*.svg",
    "flame*.svg",
    "perf.data",
]

[workspace]
members = ["trouper_macros"]

[dependencies]
# path for the workspace build, version for the published manifest
# (crates.io rejects a dependency without a version requirement).
trouper_macros = { path = "trouper_macros", version = "0.10.1" }
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
    "signal",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v7", "serde"] }
arc-swap = "1.9"
parking_lot = "0.12"
wherror = "2.4"
error-stack = "0.8"
derive_more = { version = "2.1", features = ["debug"] }
tracing = "0.1"
async-trait = "0.1"
smallvec = "1"
# The front-door channel (registry::Endpoint): sync `try_send_option` for
# the lossless refusal probe, async `send` for the Block hold, async
# `recv` in the door loop. A regular dependency: the runtime's front door
# IS a kanal channel now (the bench's control channels use the same
# crate).
kanal = "0.1"
# The `daow` feature's SQLite journal backend. Optional: consumers who
# never touch persistence pay nothing. `bundled-sqlite` (daow's default)
# compiles the amalgamation so standalone trouper builds/benches need no
# system libsqlite3; jinn's host-vs-target split is unaffected (trouper
# is a runtime link there).
daow = { version = "0.2", optional = true, default-features = false, features = [
    "bundled-sqlite",
] }
# The backend's raw-SQL door rides daow's `with_conn(&mut rusqlite::Connection)`.
# Same version/features as daow's own dep — one amalgamation, one connection
# type; rusqlite does not version-gate its own re-exports so the two resolve
# to one crate.
rusqlite = { version = "0.40", optional = true, default-features = false, features = [
    "cache",
    "bundled",
] }

[features]
default = []
# The SQLite journal backend over a `daow::Pool` (see `journal_daow`).
# Default features stay empty: the persistence tier is strictly opt-in.
daow = ["dep:daow", "dep:rusqlite"]

[dev-dependencies]
# `fs` here (examples write real files) — deliberately NOT a library
# feature: consumers opt into tokio/fs themselves.
tokio = { version = "1.53", features = ["fs"] }
rstest = "0.26"
futures = "0.3"
tracing-subscriber = "0.3"
trybuild = "1"
criterion = { version = "0.7", features = ["html_reports"] }
# On-disk SQLite databases for the daow journal tests and benches.
tempfile = "3"
# Competitor bench (benches/competitors.rs): the same prime-then-spam
# harness drives kameo and ractor service-actor tells. Dev-only: the
# published crate never links them.
kameo = "0.22"
ractor = "0.16"
# (kanal moved to [dependencies]: the runtime's front door uses it.)

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "competitors"
harness = false

[[bench]]
name = "journal"
harness = false
required-features = ["daow"]

[profile.release]
lto = true
codegen-units = 1

# Profiling build: full symbols (the frame pointers come from the build
# command's RUSTFLAGS, below — cargo has no profile key for them) so
# `perf record --call-graph fp` can unwind through tokio's inlined runtime
# internals (the default release profile unwinds to "[unknown]" and
# collapses ~a third of samples into one runtime/libc bucket). Build with:
#   RUSTFLAGS="-C force-frame-pointers=yes" cargo build \
#     --profile release-debug --example flame_tells
[profile.release-debug]
inherits = "release"
debug = true

[lints.clippy]
# The envelope rides `Result::Err` back to senders on failed delivery and
# travels by value through inbox/outbox slots by design — the caller
# dead-letters exactly what was refused. That makes `Envelope` a large
# type on purpose: its `Payload::Json` arm holds `Arc<Json>` — the tree
# is shared (a payload copy is a refcount bump), so the inline Arc keeps
# payload reads one pointer hop while `Result<_, Envelope>` stays a
# large Err. Boxing to quiet the lint would add a fetch to every message
# step for no behavioral gain. Allowed at the workspace level so the
# trade stays documented in one place instead of eight `#[allow]`s.
result_large_err = "allow"
large_enum_variant = "allow"
